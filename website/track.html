<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track booking</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<div id="site-header"></div>
<div class="page-head"><div class="container"><div class="eyebrow">Track booking</div><h1>Track your booking</h1><p>Enter the booking ID and tracking code from your confirmation.</p></div></div>
<section style="padding:36px 0 72px">
  <div class="container" style="max-width:820px">
    <form class="panel panel-pad" id="f" style="margin-bottom:24px">
      <div class="row2">
        <div class="field"><label for="id">Booking ID</label><input id="id" class="mono" placeholder="QB-7K3M9X2P" autocomplete="off"></div>
        <div class="field"><label for="tk">Tracking code</label><input id="tk" class="mono" placeholder="24-character code" autocomplete="off"></div>
      </div>
      <div id="msg"></div>
      <button class="btn btn-primary" type="submit">Track booking</button>
    </form>
    <div id="result"></div>
  </div>
</section>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  const FLOW = [['booked', 'Booked'], ['checked_in', 'Pilot checked in'], ['flight_completed', 'Flight completed'], ['report_delivered', 'Report delivered']];
  const q = new URLSearchParams(location.search);
  let cur = null, socket = null;
  const fmt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

  function show(d) {
    const idx = FLOW.findIndex((f) => f[0] === d.stage);
    const cancelled = d.stage === 'cancelled';
    $('#result').innerHTML = `<div class="panel panel-pad">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2 style="margin:0" class="mono">${esc(d.bookingId)}</h2><span class="chip"><span class="dot"></span>Live</span></div>
      ${cancelled ? '<div class="alert bad" style="margin-top:16px">This booking was cancelled. The slot is free again.</div>' :
      `<div class="stepper">${FLOW.map((f, i) => `<div class="s ${i <= idx ? 'done' : ''} ${i === idx ? 'now' : ''}"><i>${i <= idx ? '✓' : i + 1}</i>${f[1]}</div>`).join('')}</div>`}
      <div class="kv"><div><small>Status</small><b>${esc(d.stageLabel)}</b></div><div><small>Date</small><b>${fmt(d.date)}</b></div><div><small>Slot</small><b>${esc(d.slot)}</b></div><div><small>Pilot</small><b class="mono">${esc(d.pilotCode)}</b></div><div><small>Project</small><b>${esc(d.projectType)}</b></div></div></div>`;
  }

  async function load(id, tk, quiet) {
    try { const d = await api.track(id, tk); cur = { id, tk }; show(d); $('#msg').innerHTML = ''; if (!quiet) join(); }
    catch (e) { if (!quiet) { $('#msg').innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; $('#result').innerHTML = ''; } }
  }
  function join() {
    if (!window.io) return;
    if (!socket) { socket = io(QT.API); socket.on('booking.stageChanged', (d) => { if (cur && d.bookingId === cur.id) { load(cur.id, cur.tk, true); toast('Your booking status was just updated'); } }); socket.on('booking.cancelled', (d) => { if (cur && d.bookingId === cur.id) load(cur.id, cur.tk, true); }); socket.on('connect', () => cur && socket.emit('track', { id: cur.id, token: cur.tk })); }
    socket.emit('track', { id: cur.id, token: cur.tk });
  }
  $('#f').addEventListener('submit', (e) => { e.preventDefault(); load($('#id').value.trim().toUpperCase(), $('#tk').value.trim()); });
  if (q.get('id')) { $('#id').value = q.get('id'); $('#tk').value = q.get('t') || ''; }

  const s = document.createElement('script');
  s.src = QT.API + '/socket.io/socket.io.js';
  s.onload = s.onerror = () => { if (q.get('id') && q.get('t')) load(q.get('id'), q.get('t')); };
  document.body.appendChild(s);
  setInterval(() => cur && !(socket && socket.connected) && load(cur.id, cur.tk, true), 20000);
</script>
</body>
</html>
